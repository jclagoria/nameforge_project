# Testcontainers Configuration
# This configuration resolves Docker networking issues with Ryuk container in certain Linux environments

# CRITICAL: Disable Ryuk resource reaper to avoid networking issues
# Ryuk is used to clean up containers, but causes "operation not supported" errors
# with certain Docker/kernel configurations (veth network interface creation fails)
ryuk.disabled=true

# Disable checks to avoid compatibility warnings
checks.disable=true

# Container startup timeout (in seconds)
testcontainers.container.startup.timeout=120

# Disable container reuse (Ryuk is needed for reuse, so keep this false)
testcontainers.reuse.enable=false